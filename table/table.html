<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据表格</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background: #f5f7fb;
        color: #172033;
        font-family: system-ui, sans-serif;
      }

      .container {
        width: min(900px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 24px;
      }

      .table-card {
        overflow-x: auto;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 30px rgb(15 23 42 / 8%);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px 20px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        white-space: nowrap;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 14px;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover {
        background: #f8fbff;
      }

      .back-button {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 18px;
        border-radius: 9px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      .back-button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>成员列表</h1>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>职位</th>
              <th>邮箱</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>张明</td>
              <td>产品经理</td>
              <td>zhangming@example.com</td>
              <td>在职</td>
            </tr>
            <tr>
              <td>李婷</td>
              <td>UI 设计师</td>
              <td>liting@example.com</td>
              <td>在职</td>
            </tr>
            <tr>
              <td>王浩</td>
              <td>前端工程师</td>
              <td>wanghao@example.com</td>
              <td>休假</td>
            </tr>
          </tbody>
        </table>
      </div>
      <a class="back-button" href="index.html">返回首页</a>
    </main>
  </body>
</html>
