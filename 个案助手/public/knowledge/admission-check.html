<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入院准备需要核对哪些资料？</title><link rel="stylesheet" href="/knowledge/document.css"><main><p>CARES · 本地示例资料 · 非医学指南</p><h1>入院准备需要核对哪些资料？</h1><p>本地流程资料 / 入院资料核对</p><p>流程资料 · 非医学指南</p><article>核对有效入院计划、治疗计划、最近一次院前复查要求、检验检查报告、随访及咨询记录。缺失信息单独列为待核实事项。报告已上传不等于已复核，未查询到记录不等于未发生。</article><footer>此文件为交互原型中的流程说明，不是临床知识库或医疗建议。正式知识库来源待接入：个案管理中心库 → 个案管理培训资料 → 细分癌种课件。</footer></main></html>
