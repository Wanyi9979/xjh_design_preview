<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>如何核对简报中的缺失信息？</title><link rel="stylesheet" href="/knowledge/document.css"><main><p>CARES · 本地示例资料 · 非医学指南</p><h1>如何核对简报中的缺失信息？</h1><p>本地流程资料 / 简报核对</p><p>流程资料 · 非医学指南</p><article>逐项核对简报与原始记录；记录来源、时间及缺失项目。没有记录时显示暂无资料，不补写诊断、治疗周期或检验结果。编辑后重新确认简报。</article><footer>此文件为交互原型中的流程说明，不是临床知识库或医疗建议。正式知识库来源待接入：个案管理中心库 → 个案管理培训资料 → 细分癌种课件。</footer></main></html>
