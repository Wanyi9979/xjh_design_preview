<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者沟通前需要准备哪些信息？</title><link rel="stylesheet" href="/knowledge/document.css"><main><p>CARES · 本地示例资料 · 非医学指南</p><h1>患者沟通前需要准备哪些信息？</h1><p>本地流程资料 / 沟通准备</p><p>流程资料 · 非医学指南</p><article>明确本次沟通目标，查看最近沟通及未完成事项。先了解患者主要顾虑，再核对其理解和待确认问题。使用已确认的信息，不承诺疗效或代替医生作出治疗决定。</article><footer>此文件为交互原型中的流程说明，不是临床知识库或医疗建议。正式知识库来源待接入：个案管理中心库 → 个案管理培训资料 → 细分癌种课件。</footer></main></html>
