const formDefs={'生命体征':[['体温','number','℃'],['收缩压','number','mmHg'],['舒张压','number','mmHg'],['心率','number','次/分']],'CT检查':[['检查日期','date'],['肿瘤大小','number','mm'],['结节数目','number','个'],['影像结论','text'],['是否伴淋巴结肿大','radio']],'实验室检查':[['检查日期','date'],['白细胞计数','number','10⁹/L'],['血红蛋白','number','g/L'],['血小板计数','number','10⁹/L']],'不良事件':[['发生日期','date'],['事件名称','text'],['严重程度','select'],['处理措施','text'],['是否已恢复','radio']],'用药记录':[['用药日期','date'],['药品名称','text'],['单次剂量','number','mg'],['给药途径','text']],'体格检查':[['检查日期','date'],['一般情况','text'],['检查结果','text'],['是否存在异常','radio']]};
const people=[['陈晓','女',42,'138****5210'],['周宁','男',56,'139****7082'],['许文','女',38,'136****0917'],['何敏','女',49,'137****1356'],['孙建国','男',61,'135****8821']];
function dateAdd(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function makeParticipant(name,i,project=0,sex='女',age=31){return {id:'p'+i,name,code:'S'+String(i+1).padStart(3,'0'),project,sex,age,status:['已入组','已入组','筛选中','已入组','已入组','已完成','已入组','已脱落'][i%8],consent:'2026-03-26',enrolled:'2026-04-03',followup:i%4===0,visits:visitDefs.map((d,v)=>({tasks:v<3?[true,true,true]:v===4&&i%3===0?[true,false,false]:[false,false,false],self:v<3?[true,true]:v===4?[true,false]:[false,false],forms:{},actual:v<3?d[2]:v===4&&i%3===0?TODAY:'',skip:{},delay:{}}))}}
function seed(){const result={participants:['张三','李芳','王建国','赵敏','刘丽','陈志远','周梅','吴强','郑丽','王海','林芳','杨涛','朱敏','宋洁'].map((n,i)=>makeParticipant(n,i,i<8?0:i<11?1:2,i%3===2?'男':'女',31+i*2))};result.participants.forEach(p=>{p.visits.forEach((z,v)=>{if(v<3){formsFor(v).forEach(f=>{let values={};formDefs[f].forEach(([label,type],i)=>{values['f'+i]=type==='date'?visitDefs[v][2]:type==='radio'?'否':type==='number'?String({'体温':36.5,'收缩压':118,'舒张压':76,'心率':72,'肿瘤大小':12,'结节数目':2,'白细胞计数':6.2,'血红蛋白':125,'血小板计数':210,'单次剂量':10}[label]||1):type==='select'?'轻度':label==='药品名称'?'研究用药 A':label==='给药途径'?'口服':label==='事件名称'?'轻度乏力':label==='处理措施'?'随访观察':'未见明显异常（示例）'});z.forms[f]={values,submitted:true}})}})});return result}
formDefs['用药依从性记录']=[['填写日期','date'],['是否按时服药','radio'],['是否出现不适','radio']];
formDefs['生活质量问卷']=[['填写日期','date'],['生活受影响程度','select'],['补充记录','text']];
let db;try{db=JSON.parse(localStorage.getItem(STORE))||seed()}catch(e){db=seed()}
let state={page:'home',category:'execute',project:0,person:'p0',detailTab:'overview',visit:4,form:'CT检查',sourceTab:'all',workFilters:{trial:'',status:'',q:'',cycle:''},participantFilters:{status:'',q:''},projectQ:'',pageNum:1,drawer:null};
let uploads={},activeUpload={},lastFocus=null,modalReturn=null;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){toast('浏览器存储不可用，修改仅保留在本次页面中');return false}}
function pBy(id){return db.participants.find(p=>p.id===id)}function current(){return pBy(state.person)}function formsFor(v){return v===0?['生命体征','实验室检查','体格检查']:v===1?['生命体征','不良事件','用药记录']:['CT检查','实验室检查','体格检查']}
function formDone(p,v,f){return !!p.visits[v].forms[f]?.submitted}function activePerson(p){return ['已入组','筛选中'].includes(p.status)}
function tag(s){const c=['已入组','已完成','已提交','已恢复','已执行'].includes(s)?'green':['已超窗','已延期','待跟进','草稿','待提交'].includes(s)?'orange':['已脱落','筛选失败'].includes(s)?'red':['未激活','已终止','无需执行'].includes(s)?'gray':['筛选中','待同步'].includes(s)?'purple':'';return `<span class="tag ${c}">${esc(s)}</span>`}
function selectOptions(vals,val,empty){return `<option value="">${empty||'全部'}</option>`+vals.map(x=>`<option value="${esc(x[0]??x)}" ${String(x[0]??x)===String(val)?'selected':''}>${esc(x[1]??x)}</option>`).join('')}
const statuses=['筛选中','已入组','已完成','已脱落','筛选失败','已终止'];
const categories=[['plan','待制定访视计划','calendar',''],['execute','待执行访视','tube',''],['data','待数据处理','file','orange'],['follow','待跟进提醒计划','calendar','teal']];
function renderSidebar(){let nav=[['grid','工作台'],['user','患者管理'],['calendar','入院计划'],['tube','复查监测'],['bell','患者随访'],['heart','营养检测'],['chart','数据看板'],['file','消息通知'],['trial','临床试验']];$('#sidebar').innerHTML=`<div class="brand" aria-label="医疗研究平台">${ico('heart')}</div><div style="color:#298eff;margin-bottom:9px">${ico('bolt')}</div>${nav.map(([i,n])=>n==='临床试验'?`<button class="side-item selected" onclick="goHome()" aria-current="page">${ico(i)}<span>${n}</span></button>`:`<div class="side-item" title="${n}">${ico(i)}<span>${n}</span></div>`).join('')}<div class="side-bottom">${ico('settings')}</div>`}
function topbar(){let fromWork=state.page==='detail'&&state.detailOrigin?.page==='work';return `<div class="topbar between"><div class="crumb"><button class="link" onclick="goHome()">临床试验</button>${state.page==='project'?`<span>/</span><span>项目参与者</span>`:state.page==='work'?`<span>/</span><span>${categories.find(c=>c[0]===state.category)[1]}</span>`:state.page==='detail'?`<span>/</span>${fromWork?`<button class="link" onclick="backFromDetail()">${categories.find(c=>c[0]===state.category)[1]}</button>`:`<button class="link" onclick="openProject(${current().project})">${esc(projects[current().project].short)}</button>`}<span>/</span><span>参与者详情</span>`:''}</div><div class="flex small muted"><span class="profile-label">第一研究中心</span><span style="height:14px;border-left:1px solid #dfe4ed"></span><span class="profile">林</span><span class="profile-label">林晓 · CRC</span></div></div>`}
function render(){renderSidebar();$('#app').innerHTML=(state.page==='home'?'':topbar())+(state.page==='home'?homeView():state.page==='work'?workView():state.page==='project'?projectView():detailView());}
function homeView(){return `<div class="stats">${categories.map(([id,label,i,c])=>`<button class="stat ${c}" onclick="setCategory('${id}')"><div class="between"><span class="stat-label">${label}</span><span class="stat-icon">${ico(i)}</span></div><strong>${id==='follow'?new Set(allRows(id).map(r=>r.p.id)).size:allRows(id).length}</strong><span class="arrow">›</span></button>`).join('')}</div>${projectSection(false)}`}

function workFilters(){let f=state.workFilters;return `<div class="filters"><label>参与试验 <select id="wf-trial" onchange="filterWork()">${selectOptions(projects.map((p,i)=>[i,p.short]),f.trial,'全部试验')}</select></label><label>参与者状态 <select id="wf-status" onchange="filterWork()">${selectOptions(statuses.map(s=>[s,s]),f.status,'全部状态')}</select></label><label>访视周期 <select id="wf-cycle" onchange="filterWork()">${selectOptions(visitDefs.map((v,i)=>[i,v[0]+'（'+v[1]+'）']),f.cycle,'全部周期')}</select></label><input id="wf-q" type="search" aria-label="搜索参与者姓名或编号" placeholder="搜索参与者姓名 / 编号" value="${esc(f.q)}" oninput="filterWork()"><button onclick="resetWork()">重置</button></div>`}

function workTable(){let upcoming=state.category==='plan',f=state.workFilters,rows=allRows(state.category).filter(({p,v})=>(f.trial===''||p.project===+f.trial)&&(!f.status||p.status===f.status)&&(!f.cycle||v===+f.cycle)&&(!f.q||(p.name+p.code).toLowerCase().includes(f.q.toLowerCase())));state.pageNum=Math.min(state.pageNum,Math.max(1,Math.ceil(rows.length/6)));let start=(state.pageNum-1)*6;const html=`<div class="table-wrap"><table class="task-table ${upcoming?'upcoming-table':''}"><thead><tr><th>参与者</th><th>参与者编号</th><th>参与试验</th><th>所属访视</th><th>访视日期</th>${upcoming?'':'<th>访视任务</th>'}<th>参与者状态</th><th>操作</th></tr></thead><tbody>${rows.slice(start,start+6).map(({p,v})=>`<tr><td><button class="link name" onclick="openPerson('${p.id}')">${esc(p.name)}</button><span class="subline">${p.sex} / ${p.age}岁</span></td><td>${esc(p.code)}</td><td class="trial">${projects[p.project].short}</td><td>${visitDefs[v][0]}<span class="subline">${visitDefs[v][1]}</span></td><td>${visitDefs[v][2]}${upcoming?`<span class="subline">窗口期：± ${visitWindow(v)}天</span>`:''}</td>${upcoming?'':`<td><span class="small">任务 ${taskCount(p,v)}/${taskTotal(v)} <span class="muted">·</span> 数据 ${dataCount(p,v)}/${dataTotal(p,v)}</span>${state.category==='follow'?`<span class="subline">待跟进 ${followTasks(p,v).length}</span>`:''}</td>`}<td>${tag(p.status)}</td><td><div class="actions">${upcoming?`<button class="link" onclick="actionModal('skip','${p.id}',${v})">无需执行</button>`:`<button class="link" onclick="openDrawer('${p.id}',${v})">访视执行</button><span class="sep"></span><button class="link" onclick="actionModal('skip','${p.id}',${v})">无需执行</button><span class="sep"></span><button class="link" onclick="actionModal('delay','${p.id}',${v})">任务延期</button>`}</div></td></tr>`).join('')||`<tr><td colspan="${upcoming?7:8}"><div class="empty">暂无符合条件的访视任务</div></td></tr>`}</tbody></table></div>${pager(rows.length,6,'work')}`;$('#work-table').innerHTML=html;$('#work-count').textContent='（'+rows.length+'）'}

function projectSection(compact){return `<section class="panel ${compact?'project-panel':''}"><div class="panel-head between"><h2>项目列表 <span class="muted small">（${projects.length}）</span></h2><input type="search" aria-label="搜索项目" id="project-q" placeholder="搜索项目编号 / 名称" value="${esc(state.projectQ)}" oninput="state.projectQ=this.value;projectTable()"></div><div id="project-table"></div></section>`}
function projectTable(){let list=projects.filter(p=>(p.id+p.name).toLowerCase().includes(state.projectQ.toLowerCase()));$('#project-table').innerHTML=`<div class="table-wrap"><table><thead><tr><th style="width:175px">项目编号</th><th>项目名称</th><th style="width:180px">项目参与者数</th><th style="width:120px">操作</th></tr></thead><tbody>${list.map(p=>{let i=projects.indexOf(p);return `<tr><td class="muted">${p.id}</td><td><div class="flex"><span class="project-icon">${ico('folder')}</span><button class="link project-name" onclick="openProject(${i})">${p.name}</button></div></td><td><span class="project-count">${db.participants.filter(p=>p.project===i).length}</span><span class="small muted"> 人</span></td><td><button class="link small" onclick="openProject(${i})">查看参与者　›</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">暂无匹配项目</td></tr>'}</tbody></table></div>`}
function projectView(){let p=projects[state.project],f=state.participantFilters,all=db.participants.filter(x=>x.project===state.project);return `<section class="panel project-workspace"><div class="project-compact-head"><div class="project-heading-row"><div class="flex project-heading"><h1>${p.name}</h1></div><button class="primary" onclick="addModal()">＋ 添加参与者</button></div><div class="project-meta-row"><span>项目编号 <b>${p.id}</b></span><span>${p.center}</span></div></div><div class="filters project-filters"><h2>参与者 <span class="muted small">（${all.length}）</span></h2><label>状态 <select id="pf-status" onchange="filterParticipants()">${selectOptions(statuses.map(s=>[s,s]),f.status,'全部状态')}</select></label><input type="search" id="pf-q" aria-label="搜索参与者" placeholder="搜索姓名 / 参与者编号" value="${esc(f.q)}" oninput="filterParticipants()"><button onclick="resetParticipants()">重置</button></div><div id="participant-table"></div></section>`}
function participantTable(){let f=state.participantFilters,list=db.participants.filter(p=>p.project===state.project&&(!f.status||p.status===f.status)&&(!f.q||(p.name+p.code).toLowerCase().includes(f.q.toLowerCase()))),start=(state.pageNum-1)*8;$('#participant-table').innerHTML=`<div class="table-wrap"><table class="participant-table"><colgroup><col class="col-name"><col class="col-code"><col class="col-status"><col class="col-progress"><col class="col-actions"></colgroup><thead><tr><th>姓名</th><th>参与者编号</th><th>参与者状态</th><th>访视完成情况 </th><th>操作</th></tr></thead><tbody>${list.slice(start,start+8).map(p=>{let t=p.visits.reduce((s,v,i)=>s+taskCount(p,i),0),d=p.visits.reduce((s,v,i)=>s+dataCount(p,i),0);return `<tr><td><div class="flex"><span class="profile">${esc(p.name[0])}</span><div><button class="link name" onclick="openPerson('${p.id}')">${esc(p.name)}</button><span class="subline">${p.sex} / ${p.age}岁</span></div></div></td><td>${esc(p.code)}</td><td>${tag(p.status)}</td><td><div class="task-progress-cell"><div><small>任务执行</small>${t}/${personTaskTotal(p)}<div class="mini-progress"><span style="width:${t/personTaskTotal(p)*100}%"></span></div></div><div><small>数据录入</small>${d}/${personDataTotal(p)}<div class="mini-progress"><span style="width:${d/Math.max(1,personDataTotal(p))*100}%;background:#55bca8"></span></div></div></div></td><td><div class="actions"><button class="link" onclick="statusModal('${p.id}')">参与者状态</button><span class="sep"></span><button class="link" onclick="openPerson('${p.id}','data')">数据录入</button><span class="sep"></span><button class="link" onclick="openPerson('${p.id}')">查看详情</button></div></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">暂无匹配的参与者</td></tr>'}</tbody></table></div>${pager(list.length,8,'participants')}`}
function detailView(){let p=current();return `<section class="info-header panel between"><div class="flex"><span class="participant-avatar">${esc(p.name[0])}</span><div><div class="flex"><h2>${esc(p.name)} <span style="font-weight:400">（${esc(p.code)}）</span></h2>${tag(p.status)}<span class="small">${p.sex} / ${p.age}岁</span></div><div class="info-meta"><span><label>知情同意书签署时间</label>${p.consent||'待签署'}</span><span class="sep"></span><span><label>入组时间</label>${p.enrolled||'待入组'}</span><span class="sep"></span><span><label>参与试验</label>${projects[p.project].short}</span></div></div></div><button onclick="statusModal('${p.id}')">参与者状态</button></section><section class="panel"><div class="tabs"><button class="tab ${state.detailTab==='overview'?'active':''}" onclick="switchDetail('overview')">访视总览</button><button class="tab ${state.detailTab==='data'?'active':''}" onclick="switchDetail('data')">数据录入</button></div>${state.detailTab==='overview'?overviewView(p):entryView(p)}</section>`}
function progressPair(p,v){return `<div class="progress-pair"><div class="progress-item"><span class="ring" style="--progress:${taskCount(p,v)/taskTotal(v)*100}%"></span><div><small>任务执行</small>${taskCount(p,v)}/${taskTotal(v)}</div></div><div class="progress-item"><span class="ring" style="--progress:${dataCount(p,v)/Math.max(1,dataTotal(p,v))*100}%"></span><div><small>数据录入</small>${dataCount(p,v)}/${dataTotal(p,v)}</div></div><span class="spacer"></span><span class="small" style="color:var(--primary)">去处理 ›</span></div>`}
function overviewView(p){return `<div class="detail-body"><div class="between"><h2>今日需关注 <span style="color:#7392b6;font-size:12px;font-weight:400;margin-left:12px">05-01（周五）</span></h2></div><div class="attention">${[3,4,5].filter(v=>vStatus(p,v)!=='已完成').map((v)=>{let i=v-3;return `<button class="focus-card ${['overdue','today',''][i]}" onclick="openDrawer('${p.id}',${v})"><div class="ribbon">${['超窗待访视','今日待访视','即将访视'][i]}</div><div class="focus-inner"><h3>${visitDefs[v][0]}（${visitDefs[v][1]}）</h3><div class="window">${dateAdd(visitDefs[v][2],-3)} ~ ${dateAdd(visitDefs[v][2],3)}　<span style="color:${i===0?'#ed942f':i===1?'#f05f65':'#168cff'}">${i===0?'已超窗':i===1?'剩余3天':''}</span></div>${i<2?progressPair(p,v):`<div class="window-notice"><span class="window-countdown">${ico('clock')}<span>4天后进入访视窗口</span></span><span class="window-action">查看 ›</span></div>`}</div></button>`}).join('')||'<p class="muted small">暂无需要关注的访视</p>'}</div><div class="between"><h2>计划访视 <span style="margin-left:7px">（9）</span></h2></div><div class="visit-grid">${visitDefs.map((v,i)=>`<button class="visit-card ${i<3?'completed':i===3?'overdue':''}" onclick="openDrawer('${p.id}',${i})"><div class="visit-date">${ico('clock')}${v[2]}</div><div class="visit-name"><span>${v[0]}${i===0||i===8?'':`（${v[1]}）`}</span>${tag(vStatus(p,i))}</div><div class="meta"><span>时间窗口</span><span>± 3天</span></div><div class="meta"><span>实际访视</span><span>${p.visits[i].actual||'—'}</span></div><div class="visit-progress"><div><small>任务执行</small>${taskCount(p,i)}/${taskTotal(i)}</div><div><small>数据录入</small>${dataCount(p,i)}/${dataTotal(p,i)}</div></div></button>`).join('')}</div><div class="adverse">${['不良事件','合并用药','非计划访视','研究结束记录'].map((s,i)=>`<button onclick="openExtra('${s}')"><span>${s}</span><div><small>数据录入</small>${tag(extraDataStatus(p.visits[4].forms[s]))}</div></button>`).join('')}</div></div>`}
function entryView(p){let f=p.visits[state.visit].forms[state.form],done=formDone(p,state.visit,state.form);return `<div class="entry-layout"><aside class="crf-nav"><h3>访视与数据 <span class="muted small">V2.0</span><span class="muted small" style="float:right">${Math.round(p.visits.reduce((s,v,i)=>s+dataCount(p,i),0)/Math.max(1,personDataTotal(p))*100)}%</span></h3><input id="crf-search" type="search" placeholder="⌕ 搜索访视 / CRF" oninput="filterTree()" aria-label="搜索访视或CRF"><div class="nav-filter">当前状态： <select id="crf-status" onchange="filterTree()"><option value="">全部</option><option value="pending">待录入</option><option value="draft">待提交 / 待同步</option><option value="done">已完成</option></select></div><div class="tree" id="crf-tree">${treeView(p)}</div></aside><section class="form-column"><div class="between"><h3>${esc(state.form)}</h3><span id="form-status">${tag(extraDataStatus(f))}</span></div><div class="small muted" style="margin-top:6px">${visitDefs[state.visit][0]}（${visitDefs[state.visit][1]}）${f?.source?` · 来源：${esc(f.source)}`:''}</div><form id="crf-form" class="form-content" onsubmit="event.preventDefault();saveForm(true)"><fieldset class="form-fields" ${canWriteForm()?'':'disabled'}>${fieldsView(p)}</fieldset><div class="form-foot">${state.entryReturn?'<button type="button" onclick="returnToTasks()">返回任务清单</button>':''}${canWriteForm()?extraFormActions():tag('只读')}</div></form></section><aside class="source"><div class="source-head"><div class="between"><h3>源数据 / 访视资料</h3><button class="link small" onclick="chooseFiles()" ${canWriteForm()?'':'disabled'}>＋ 上传资料</button></div><div class="source-types">${[['all','全部资料'],['image','照片'],['file','文件'],['form','参与者表单']].map(([id,n])=>`<button class="${state.sourceTab===id?'active':''}" onclick="sourceTab('${id}')">${n}</button>`).join('')}</div></div><div class="source-content" id="source-content"></div><input type="file" id="source-upload" multiple accept="image/jpeg,image/png,application/pdf" hidden onchange="uploadFiles(this.files)"></aside></div>`}
function treeView(p){return visitDefs.map((v,i)=>`<details ${i<6||i===state.visit?'open':''} data-cycle="${i}"><summary><span>${v[0]}${i?`（${v[1]}）`:''}</span><small>${dataCount(p,i)}/${dataTotal(p,i)}</small></summary>${taskDefs(i).filter(t=>t.form).map(t=>t.form).map(f=>{taskState(p,i,taskForForm(i,f));let s=extraDataStatus(p.visits[i].forms[f])==='已完成'?'done':p.visits[i].forms[f]?'draft':'pending';return `<button class="${state.visit===i&&state.form===f?'active':''}" data-form-name="${f}" data-form-state="${s}" onclick="selectForm(${i},'${f}')"><span>${f}</span><i class="dot" style="color:${s==='done'?'#14ad7b':s==='draft'?'#ed942f':'#a4b0c2'}"></i></button>`}).join('')}${taskDefs(i).filter(t=>t.kind==='文件').map(t=>`<button data-form-name="${t.title}" data-form-state="${dataState(p,i,t)==='已完成'?'done':dataState(p,i,t)==='待录入'?'pending':'draft'}" onclick="fileTaskModal('${p.id}',${i},'${t.id}')"><span>${t.title}</span><i class="dot" style="color:${dataState(p,i,t)==='已完成'?'#14ad7b':'#a4b0c2'}"></i></button>`).join('')}</details>`).join('')}
function fieldsView(p){let f=p.visits[state.visit].forms[state.form],values=f?.values||{},defs=formDefs[state.form]||[['记录日期','date'],['记录内容','text'],['补充说明','text']];return defs.map(([label,type,unit],i)=>{let val=values['f'+i]??'';if(type==='radio')return `<div class="field"><label>${label}<span class="required">*</span></label><div class="radio-group">${['是','否'].map(s=>`<label><input type="radio" name="f${i}" value="${s}" required ${val===s?'checked':''}> ${s}</label>`).join('')}</div></div>`;if(type==='select')return `<div class="field"><label for="f${i}">${label}<span class="required">*</span></label><select id="f${i}" name="f${i}" required>${selectOptions(['轻度','中度','重度'].map(s=>[s,s]),val,'请选择')}</select></div>`;return `<div class="field"><label for="f${i}">${label}<span class="required">*</span></label>${unit?'<div class="unit-wrap">':''}<input id="f${i}" name="f${i}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="any"':''} required>${unit?`<span>${unit}</span></div>`:''}</div>`}).join('')}
function refresh(){render();hydrate()}
function hydrate(){if(state.page==='home')projectTable();if(state.page==='work')workTable();if(state.page==='project')participantTable();if(state.page==='detail'&&state.detailTab==='data'){renderSource();let tree=document.querySelector('#crf-tree'),selected=tree?.querySelector('button.active');if(selected)tree.scrollTop=Math.max(0,selected.offsetTop-90)}}
function goHome(){stashForm();closeDrawer();state.page='home';state.pageNum=1;refresh();window.scrollTo(0,0)}
function setCategory(s){stashForm();closeDrawer();state.page='work';state.category=s;state.pageNum=1;state.workFilters={trial:'',status:'',q:'',cycle:''};refresh();window.scrollTo(0,0)}
function filterWork(){state.workFilters={trial:$('#wf-trial').value,status:$('#wf-status').value,cycle:$('#wf-cycle').value,q:$('#wf-q').value};state.pageNum=1;workTable()}
function resetWork(){state.workFilters={trial:'',status:'',q:'',cycle:''};state.pageNum=1;refresh()}
function filterParticipants(){state.participantFilters={status:$('#pf-status').value,q:$('#pf-q').value};state.pageNum=1;participantTable()}
function resetParticipants(){state.participantFilters={status:'',q:''};state.pageNum=1;refresh()}
function pageSet(n,w){state.pageNum=n;w==='work'?workTable():participantTable()}
function pageChange(n,w){pageSet(state.pageNum+n,w)}
function openProject(i){stashForm();closeDrawer();state.page='project';state.project=i;state.pageNum=1;state.participantFilters={status:'',q:''};refresh();window.scrollTo(0,0)}
function openPerson(id,tab='overview'){state.entryReturn=null;rememberDetailOrigin();stashForm();closeDrawer();state.person=id;state.page='detail';state.detailTab=tab;state.visit=4;state.form='CT检查';state.sourceTab='all';refresh();window.scrollTo(0,0)}
function rememberDetailOrigin(){if(state.page==='work'||state.page==='project')state.detailOrigin={page:state.page,pageNum:state.pageNum,project:state.project}}
function backFromDetail(){stashForm();closeDrawer();const o=state.detailOrigin;if(o){state.page=o.page;state.pageNum=o.pageNum;state.project=o.project}else{state.page='project';state.project=current().project;state.pageNum=1}refresh();window.scrollTo(0,0)}
function switchDetail(tab){stashForm();state.detailTab=tab;refresh()}
function isExtraForm(){return state.visit===4&&['不良事件','合并用药','非计划访视','研究结束记录'].includes(state.form)}
function extraDataStatus(form){if(!form)return '待录入';if(form.submitted)return form.synced===false?'待同步':'已完成';return Object.values(form.values||{}).some(v=>String(v).trim())?'待提交':'待录入'}
function extraFormActions(){const f=current().visits[state.visit].forms[state.form],status=extraDataStatus(f);return `<button type="button" class="soft" onclick="saveForm(false)">保存草稿</button><button type="submit" class="${status==='待同步'?'soft':'primary'}">提交</button>${status==='待同步'?'<button type="button" class="primary" onclick="syncExtraForm()">同步数据</button>':''}`}
function syncExtraForm(){if(!canWriteForm())return;stashForm();const f=current().visits[state.visit].forms[state.form];if(!f?.submitted){refresh();toast('请先提交修改后的数据');return}f.synced=true;persist();refresh();toast('数据已同步')}
function openExtra(f){stashForm();state.visit=4;state.form=f;state.detailTab='data';refresh()}
function selectForm(v,f){stashForm();state.visit=v;state.form=f;state.entryReturn=null;refresh()}
function filterTree(){let q=$('#crf-search').value.trim(),s=$('#crf-status').value;document.querySelectorAll('#crf-tree details').forEach(d=>{let any=false;d.querySelectorAll('button').forEach(b=>{let match=(!q||(b.dataset.formName+visitDefs[+d.dataset.cycle].join('')).includes(q))&&(!s||b.dataset.formState===s);b.hidden=!match;b.style.display=match?'':'none';if(match)any=true});d.hidden=!any;if(q||s)d.open=true})}
function stashForm(){if(state.page!=='detail'||state.detailTab!=='data'||!$('#crf-form')||!canWriteForm())return;let vals=Object.fromEntries(new FormData($('#crf-form')).entries()),old=current().visits[state.visit].forms[state.form];if(JSON.stringify(vals)!==JSON.stringify(old?.values)&&formRecordSaved(current(),state.visit,state.form,vals,false))persist()}
function saveForm(submit){if(!canWriteForm())return;let form=$('#crf-form');if(submit&&!form.reportValidity())return;let values=Object.fromEntries(new FormData(form).entries());if(!formRecordSaved(current(),state.visit,state.form,values,submit)){toast('请先填写数据');return}persist();refresh();toast(submit?'数据已提交，待同步':'草稿已保存，任务已执行')}
function sourceKey(){return state.person+'-'+state.visit+'-'+state.form}
function sourceTab(t){stashForm();state.sourceTab=t;refresh()}
function chooseFiles(){if(!canWriteForm())return;$('#source-upload').click()}
function uploadFiles(files){if(!canWriteForm())return;let key=sourceKey(),valid=0;for(let f of files){if(!['image/jpeg','image/png','application/pdf'].includes(f.type)){toast('仅支持 JPG、PNG、PDF 文件');continue}if(f.size>5*1024*1024){toast('单个文件不可超过 5MB');continue}(uploads[key]??=[]).push({name:f.name,type:f.type,url:URL.createObjectURL(f)});valid++}if(valid){activeUpload[key]=uploads[key].length-1;renderSource();toast('已添加 '+valid+' 份访视资料')}}
function renderSource(){let box=$('#source-content');if(!box)return;let key=sourceKey(),files=uploads[key]||[],filtered=files.map((f,i)=>({...f,i})).filter(f=>state.sourceTab==='all'||state.sourceTab==='image'&&f.type.startsWith('image')||state.sourceTab==='file'&&f.type==='application/pdf');if(state.sourceTab==='form'){let f=current().visits[state.visit].forms[state.form];box.innerHTML=f?.source==='参与者'?`<div class="source-form"><div class="between"><h3>${esc(state.form)}</h3>${tag(extraDataStatus(f))}</div><p>${esc(current().name)} · 参与者提交</p>${(formDefs[state.form]||[]).map(([name],i)=>`<p>${esc(name)}<span style="float:right">${esc(f.values['f'+i]||'—')}</span></p>`).join('')}</div>`:'<div class="empty">暂无参与者提交资料</div>';return}if(!filtered.length){box.innerHTML=`<div class="upload-empty"><div class="cloud">${ico('upload')}</div><h3>${canWriteForm()?'上传访视资料':'暂无访视资料'}</h3>${canWriteForm()?'<button class="soft" onclick="chooseFiles()">选择文件</button>':''}</div>`}else{let a=filtered.find(f=>f.i===activeUpload[key])||filtered[0];box.innerHTML=`<div class="file-list">${filtered.map(f=>`<button class="${a.i===f.i?'soft':''}" onclick="activeUpload[sourceKey()]=${f.i};renderSource()">${esc(f.name)}</button>`).join('')}</div>${a.type.startsWith('image')?`<img src="${a.url}" alt="${esc(a.name)}">`:`<iframe src="${a.url}" title="${esc(a.name)}"></iframe>`}<div class="between small" style="width:100%"><span class="muted">${esc(a.name)}</span><button class="link" onclick="removeFile(${a.i})">移除</button></div>`}box.ondragover=e=>{e.preventDefault();box.style.background='#e7f2ff'};box.ondragleave=()=>box.style.background='';box.ondrop=e=>{e.preventDefault();box.style.background='';uploadFiles(e.dataTransfer.files)}}
function removeFile(i){if(!canWriteForm())return;let files=uploads[sourceKey()];URL.revokeObjectURL(files[i].url);files.splice(i,1);renderSource()}
function openDrawer(id,v){lastFocus=document.activeElement;state.drawer={id,v};drawDrawer();document.body.style.overflow='hidden';$('#drawer-close').focus()}
function setActual(v){let d=state.drawer;pBy(d.id).visits[d.v].actual=v;persist();refresh()}
function closeDrawer(){if(!state.drawer)return;state.drawer=null;$('#overlay-root').innerHTML='';document.body.style.overflow='';lastFocus?.focus?.()}
function drawerToForm(f){let d=state.drawer;rememberDetailOrigin();stashForm();state.person=d.id;state.visit=d.v;state.form=f;state.page='detail';state.detailTab='data';state.sourceTab='all';closeDrawer();refresh();window.scrollTo(0,0)}
function drawerSource(){drawerToForm(formsFor(state.drawer.v)[0]);state.sourceTab='form';refresh()}
function modal(title,body,footer){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head between"><h2>${title}</h2><button class="iconbtn" aria-label="关闭弹窗" onclick="closeModal()">✕</button></div><div class="modal-body">${body}<div id="modal-error" class="error" aria-live="polite"></div></div><div class="modal-foot"><button onclick="closeModal()">取消</button>${footer}</div></section></div>`;document.body.style.overflow='hidden';$('#modal-root input, #modal-root select, #modal-root textarea, #modal-root button')?.focus()}
function closeModal(){$('#modal-root').innerHTML='';if(!state.drawer)document.body.style.overflow='';modalReturn?.focus?.()}
function statusModal(id){stashForm();let p=pBy(id);modal('更改参与者状态',`<div class="callout">${esc(p.name)}（${esc(p.code)}） · ${projects[p.project].short}</div><div class="field"><label>参与者状态 <span class="required">*</span></label><select id="new-status">${statuses.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>变更说明 <span class="required">*</span></label><textarea id="status-reason" placeholder="请输入状态变更原因"></textarea></div>${p.statusNote?`<div class="small muted">最近变更：${esc(p.statusNote)}</div>`:''}`,`<button class="primary" onclick="saveStatus('${id}')">确认更改</button>`)}
function saveStatus(id){let reason=$('#status-reason').value.trim();if(!reason){$('#modal-error').textContent='请填写状态变更说明';return}let p=pBy(id);p.status=$('#new-status').value;p.statusNote=reason;if(p.status==='已入组'&&!p.enrolled)p.enrolled=TODAY;persist();closeModal();refresh();if(state.drawer)drawDrawer();toast('参与者状态已更新')}
function addModal(){modal('添加参与者',`<input type="search" id="person-search" placeholder="搜索已有人员姓名 / 手机尾号" style="width:100%" oninput="renderPeople()"><div id="people-list" class="person-list"></div><div class="field"><label for="participant-code">参与者编号 <span class="required">*</span></label><input id="participant-code" placeholder="请输入参与者编号" maxlength="24"></div>`,`<button class="primary" onclick="saveParticipant()">确认添加</button>`);renderPeople()}
function renderPeople(){let q=$('#person-search').value;$('#people-list').innerHTML=people.map((p,i)=>({p,i})).filter(({p})=>(p[0]+p[3]).includes(q)).map(({p,i})=>{let exists=db.participants.some(x=>x.project===state.project&&x.name===p[0]);return `<label class="person-option"><input type="radio" name="existing-person" value="${i}" ${exists?'disabled':''}><span>${p[0]} <small class="muted">${p[1]} / ${p[2]}岁</small></span><span class="spacer"></span><small class="muted">${exists?'已在本项目':p[3]}</small></label>`}).join('')||'<div class="empty">未找到匹配人员</div>'}
function saveParticipant(){let choice=$('input[name=existing-person]:checked'),code=$('#participant-code').value.trim(),error=$('#modal-error');if(!choice){error.textContent='请先选择一位已有人员';return}if(!/^[A-Za-z0-9_-]{2,24}$/.test(code)){error.textContent='编号须为 2–24 位字母、数字、下划线或短横线';return}if(db.participants.some(p=>p.project===state.project&&p.code.toLowerCase()===code.toLowerCase())){error.textContent='该编号已存在，请输入其他编号';return}let person=people[+choice.value],p=makeParticipant(person[0],db.participants.length,state.project,person[1],person[2]);p.code=code;p.status='筛选中';p.consent='';p.enrolled='';p.followup=false;p.visits.forEach(v=>{v.tasks=[false,false,false];v.self=[false,false];v.actual='';v.forms={}});p.new=true;db.participants.push(p);persist();closeModal();refresh();toast('参与者已添加至当前项目')}
function resetDemoModal(){modal('重置演示数据','<p class="small">将恢复初始示例，清除本原型中新增的参与者、状态变更、任务处理和表单填写。</p>','<button class="primary" onclick="resetDemo()">恢复初始示例</button>')}
function resetDemo(){closeModal();closeDrawer();db=seed();persist();Object.values(uploads).flat().forEach(f=>URL.revokeObjectURL(f.url));uploads={};activeUpload={};state.page='home';state.category='execute';state.pageNum=1;state.projectQ='';state.workFilters={trial:'',status:'',q:'',cycle:''};refresh();window.scrollTo(0,0);toast('已恢复初始示例')}
let toastTimer;function toast(s){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast"><b>✓</b>${esc(s)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3200)}
document.addEventListener('keydown',e=>{let root=$('#modal-root').firstElementChild?$('#modal-root'):state.drawer?$('#overlay-root'):null;if(e.key==='Escape'){if($('#modal-root').firstElementChild)closeModal();else closeDrawer()}if(e.key==='Tab'&&root){let a=[...root.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null),first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',stashForm);
// Seeded historical visits have submitted forms; newly added participants begin with empty CRFs.

// Demo definitions stand in for the externally configured task rules.
function taskDefs(v){return [...formsFor(v).map((form,i)=>({id:'crf'+i,title:({CT检查:'安排 CT 检查并核对报告',实验室检查:'采集检验报告并核对结果',体格检查:'完成体格检查记录',生命体征:'测量并记录生命体征'})[form]||form,kind:'表单',form,actors:['CRC'],manage:true})),{id:'self0',title:'用药依从性记录',kind:'表单',form:'用药依从性记录',actors:['参与者'],manage:true},{id:'self1',title:'生活质量问卷',kind:'表单',form:'生活质量问卷',actors:['CRC','参与者'],manage:true},...(v===4?[{id:'report',title:'上传检查报告',kind:'文件',actors:['CRC','参与者'],manage:true},{id:'plan',title:'落实下次访视安排',kind:'计划',actors:['CRC'],manage:true}]:[])]}
function taskState(p,v,t){let z=p.visits[v];z.taskRecords??={};if(!z.taskRecords[t.id]){let i=+t.id.slice(-1),legacy=t.id.startsWith('crf')?z.tasks[i]:t.id.startsWith('self')?z.self[i]:false,skip=z.skip[t.id]||z.skip[t.id.startsWith('crf')?i:'none'],delay=z.delay[t.id]||z.delay[t.id.startsWith('crf')?i:'none'];z.taskRecords[t.id]={execution:skip?'无需执行':legacy?'已执行':delay?'已延期':'待执行',reason:skip||delay?.reason||'',due:delay?.date||'',history:[]};if(t.id.startsWith('self')&&legacy&&!z.forms[t.form])z.forms[t.form]={values:t.id==='self0'?{f0:TODAY,f1:'是',f2:'否'}:{f0:TODAY,f1:'轻度',f2:'无'},submitted:true,synced:true,source:'参与者'};if(p.followup&&v===4&&t.id==='self1'&&!legacy&&!delay){Object.assign(z.taskRecords[t.id],{execution:'已延期',due:dateAdd(TODAY,1),reason:'待确认问卷填写安排'})}}return z.taskRecords[t.id]}
function dataState(p,v,t){let r=taskState(p,v,t);if(t.kind==='计划'||r.execution==='无需执行')return '—';return extraDataStatus(t.kind==='文件'?r.fileData:p.visits[v].forms[t.form])}
function taskForForm(v,f){return taskDefs(v).find(t=>t.form===f)}
function canWriteTask(p,v,t){return !t||t.actors.includes('CRC')&&taskState(p,v,t).execution!=='无需执行'}
function canWriteForm(){return canWriteTask(current(),state.visit,taskForForm(state.visit,state.form))}
function taskTotal(v){return taskDefs(v).length}
function dataTotal(p,v){return taskDefs(v).filter(t=>t.kind!=='计划'&&taskState(p,v,t).execution!=='无需执行').length}
function personTaskTotal(p){return p.visits.reduce((s,z,v)=>s+taskTotal(v),0)}
function personDataTotal(p){return p.visits.reduce((s,z,v)=>s+dataTotal(p,v),0)}
function taskCount(p,v){return taskDefs(v).filter(t=>['已执行','无需执行'].includes(taskState(p,v,t).execution)).length}
function dataCount(p,v){return taskDefs(v).filter(t=>dataState(p,v,t)==='已完成').length}
function visitDone(p,v){return taskCount(p,v)===taskTotal(v)&&dataCount(p,v)===dataTotal(p,v)}
function followTasks(p,v){return taskDefs(v).filter(t=>taskState(p,v,t).execution==='已延期')}
function taskTransition(p,v,t,action,{reason='',date='',source='CRC'}={}){let r=taskState(p,v,t);if(action==='execute'||action==='data'){if(!canWriteTask(p,v,t))return false;if(action==='execute'&&r.execution==='已执行')return false;r.execution='已执行';r.executedAt=date||TODAY;r.source=source;p.visits[v].actual||=date||TODAY}else if(action==='restore'){if(r.execution!=='无需执行'||!t.manage||!reason)return false;r.execution='待执行'}else{if(!t.manage||!['待执行','已延期'].includes(r.execution)||!reason)return false;if(action==='delay'&&(!date||date<=TODAY))return false;r.execution=action==='skip'?'无需执行':'已延期'}r.reason=reason;r.due=action==='delay'?date:'';r.history.push({action,date:date||TODAY,reason,source,at:new Date().toISOString()});if(t.id.startsWith('crf')){let i=+t.id.slice(-1);p.visits[v].tasks[i]=r.execution==='已执行';delete p.visits[v].delay[i];delete p.visits[v].skip[i]}p.followup=false;return true}
function formRecordSaved(p,v,f,values,submitted){let t=taskForForm(v,f);if(!canWriteTask(p,v,t))return false;let nonempty=Object.values(values).some(x=>String(x).trim());if(!nonempty)return false;let previous=p.visits[v].forms[f];let revisions=previous?.revisions||[];if(previous&&JSON.stringify(previous.values)!==JSON.stringify(values)){let {revisions:ignored,...snapshot}=previous;revisions=[...revisions,snapshot]}p.visits[v].forms[f]={values,submitted,synced:false,source:'CRC',updatedAt:new Date().toISOString(),revisions};if(t)taskTransition(p,v,t,'data');return true}
function allRows(category){let rows=[];db.participants.filter(activePerson).forEach(p=>{let vs=category==='follow'?visitDefs.map((_,v)=>v).filter(v=>followTasks(p,v).length):category==='plan'?[5]:category==='execute'?[3,4]:category==='data'?visitDefs.map((_,v)=>v).filter(v=>v<=4||taskDefs(v).some(t=>taskState(p,v,t).execution==='已执行')):[];vs.forEach(v=>{if(category==='data'&&dataCount(p,v)===dataTotal(p,v))return;if(category==='execute'&&visitDone(p,v))return;rows.push({p,v})})});return rows}
function vStatus(p,v){if(visitDone(p,v))return '已完成';if(v<4)return '已超窗';if(v===4)return '进行中';if(v===5)return '待访视';return '未激活'}
function drawDrawer(){let {id,v}=state.drawer,p=pBy(id),z=p.visits[v],defs=taskDefs(v),filter=state.drawer.filter||'all';$('#overlay-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDrawer()"><section class="drawer task-drawer" role="dialog" aria-modal="true" aria-label="访视任务详情"><div class="drawer-head between"><h2>访视任务详情</h2><button id="drawer-close" class="iconbtn" aria-label="关闭抽屉" onclick="closeDrawer()">✕</button></div><div class="drawer-body"><div class="drawer-info compact-visit"><div class="between"><h3>${visitDefs[v][0]}（${visitDefs[v][1]}）</h3>${tag(vStatus(p,v))}</div><div class="visit-identity"><b>${esc(p.name)}（${esc(p.code)}）</b>${tag(p.status)}<span class="muted">${esc(projects[p.project].short)}</span></div><div class="visit-dates"><span><label>计划访视</label>${visitDefs[v][2]} <span class="muted">±3天</span></span><label>实际访视 <input type="date" aria-label="实际访视日期" value="${z.actual}" onchange="setActual(this.value)"></label></div></div><div class="task-toolbar"><div class="task-tabs">${[['all','全部',defs.length],['pending','待处理',defs.filter(t=>!['已执行','无需执行'].includes(taskState(p,v,t).execution)||!['已完成','—'].includes(dataState(p,v,t))).length],['follow','待跟进',followTasks(p,v).length]].map(([k,n,c])=>`<button class="${filter===k?'active':''}" onclick="state.drawer.filter='${k}';drawDrawer()">${n} <span>${c}</span></button>`).join('')}</div><span class="small muted">执行 ${taskCount(p,v)}/${taskTotal(v)} · 数据 ${dataCount(p,v)}/${dataTotal(p,v)}</span></div><div class="unified-tasks">${defs.filter(t=>filter==='all'||filter==='follow'&&taskState(p,v,t).execution==='已延期'||filter==='pending'&&(!['已执行','无需执行'].includes(taskState(p,v,t).execution)||!['已完成','—'].includes(dataState(p,v,t)))).map(t=>taskRow(p,v,t)).join('')||'<div class="empty">暂无任务</div>'}</div></div><div class="drawer-foot"><button onclick="closeDrawer()">关闭</button></div></section></div>`}
function taskRow(p,v,t){let r=taskState(p,v,t),write=canWriteTask(p,v,t),pending=['待执行','已延期'].includes(r.execution),record=t.kind==='文件'?r.fileData:p.visits[v].forms[t.form],ds=dataState(p,v,t);return `<article class="task-row ${r.execution==='已延期'?'delayed':''}"><div class="task-row-heading"><span class="task-kind-icon">${ico(t.kind==='文件'?'file':t.kind==='计划'?'calendar':'grid')}</span><h3>${esc(t.title)}</h3>${tag(r.execution)}</div><div class="task-meta"><span>${t.kind}</span><span>可${t.kind==='文件'?'上传':t.kind==='计划'?'执行':'填写'}：${t.actors.join(' / ')}</span>${record?.source?`<span>来源：${esc(record.source)}</span>`:''}</div><div class="task-row-bottom"><div class="task-data">${t.kind!=='计划'?`<span class="muted">数据</span>${tag(ds)}`:`<span class="muted small">执行日期 ${r.executedAt||'—'}</span>`}</div><div class="task-actions">${pending&&write?`<button class="link" onclick="actionModal('execute','${p.id}',${v},'${t.id}')">标记已执行</button>`:''}${t.kind!=='计划'&&r.execution!=='无需执行'?`<button class="${write?'soft':'link'}" onclick="taskDataEntry('${p.id}',${v},'${t.id}')">${write?(ds==='已完成'?'查看数据':t.kind==='文件'?'上传资料':'数据录入'):'查看数据'}</button>`:''}${pending&&t.manage?`<button class="link secondary" onclick="actionModal('skip','${p.id}',${v},'${t.id}')">无需执行</button><button class="link secondary" onclick="actionModal('delay','${p.id}',${v},'${t.id}')">${r.execution==='已延期'?'调整延期':'任务延期'}</button>`:''}${r.execution==='无需执行'&&t.manage?`<button class="link" onclick="actionModal('restore','${p.id}',${v},'${t.id}')">恢复执行</button>`:''}</div></div>${r.execution==='已延期'||r.execution==='无需执行'?`<div class="task-exception">${r.execution==='已延期'?`待跟进 · ${esc(r.due)}　`:''}${esc(r.reason)}</div>`:''}${r.history.length?`<details class="task-history"><summary>处理记录（${r.history.length}）</summary>${r.history.slice().reverse().map(h=>`<div>${esc(h.date)} · ${({execute:'标记已执行',data:'数据已保存',delay:'任务延期',skip:'无需执行',restore:'恢复执行'})[h.action]} · ${esc(h.source)}${h.reason?' · '+esc(h.reason):''}</div>`).join('')}</details>`:''}</article>`}
function actionModal(type,id,v,taskId){let p=pBy(id),defs=taskDefs(v).filter(t=>taskId?t.id===taskId:['待执行','已延期'].includes(taskState(p,v,t).execution)&&t.manage),title={skip:'标记无需执行',delay:'任务延期',execute:'标记已执行',restore:'恢复执行'}[type];modal(title,`<div class="small muted" style="margin-bottom:14px">${esc(p.name)}（${esc(p.code)}） · ${visitDefs[v][1]}</div><div class="field">${defs.map(t=>`<label class="person-option"><input name="action-task" type="checkbox" value="${t.id}" ${taskId?'checked hidden':''}>${esc(t.title)}</label>`).join('')||'暂无可处理任务'}</div>${['delay','execute'].includes(type)?`<div class="field"><label>${type==='delay'?'延期至':'执行日期'} <span class="required">*</span></label><input id="delay-date" type="date" ${type==='delay'?`min="${dateAdd(TODAY,1)}"`:`max="${TODAY}"`} value="${type==='delay'?dateAdd(TODAY,1):TODAY}"></div>`:''}<div class="field"><label>${type==='execute'?'执行备注':type==='restore'?'恢复原因':'原因'} ${type==='execute'?'':'<span class="required">*</span>'}</label><textarea id="action-reason"></textarea></div>`,`<button class="primary" onclick="saveAction('${type}','${id}',${v})">确认</button>`)}
function saveAction(type,id,v){let ids=[...document.querySelectorAll('input[name=action-task]:checked')].map(c=>c.value),reason=$('#action-reason').value.trim(),date=$('#delay-date')?.value,error=$('#modal-error'),p=pBy(id);if(!ids.length){error.textContent='请选择任务';return}if(type!=='execute'&&!reason){error.textContent='请填写原因';return}if(type==='delay'&&(!date||date<=TODAY)||type==='execute'&&(!date||date>TODAY)){error.textContent='请选择有效日期';return}let ok=ids.map(id=>taskDefs(v).find(t=>t.id===id)).every(t=>taskTransition(p,v,t,type,{reason,date}));if(!ok){error.textContent='任务状态或操作权限已变化，请重新打开';return}persist();closeModal();refresh();if(state.drawer)drawDrawer();toast(type==='delay'?'任务已进入待跟进':'任务状态已更新')}
function taskDataEntry(id,v,tid){let t=taskDefs(v).find(t=>t.id===tid);if(t.kind==='文件'){fileTaskModal(id,v,tid);return}if(t.kind==='计划')return;state.entryReturn={id,v};drawerToForm(t.form)}
function returnToTasks(){stashForm();let d=state.entryReturn||{id:state.person,v:state.visit};state.entryReturn=null;openDrawer(d.id,d.v)}
function fileTaskModal(id,v,tid){stashForm();let p=pBy(id),t=taskDefs(v).find(t=>t.id===tid),r=taskState(p,v,t),write=canWriteTask(p,v,t),files=uploads[id+'-'+v+'-'+tid]||[];modal(t.title,`<div class="between" style="margin-bottom:16px"><span class="small muted">${esc(p.name)}（${esc(p.code)}）</span>${tag(dataState(p,v,t))}</div>${(r.files||[]).map(f=>`<div class="person-option">${ico('file')}<span>${esc(f.name)}</span>${files.find(x=>x.name===f.name)?`<a style="margin-left:auto" href="${files.find(x=>x.name===f.name).url}" target="_blank" rel="noopener">预览</a>`:''}</div>`).join('')||'<div class="empty">暂无资料</div>'}${write?`<input type="file" id="task-files" accept="image/jpeg,image/png,application/pdf" multiple onchange="saveTaskFiles('${id}',${v},'${tid}',this.files)">`:''}`,`${write&&r.files?.length&&dataState(p,v,t)!=='已完成'?`<button class="primary" onclick="submitTaskFiles('${id}',${v},'${tid}')">${dataState(p,v,t)==='待同步'?'同步数据':'提交资料'}</button>`:''}`)}
function saveTaskFiles(id,v,tid,files){let p=pBy(id),t=taskDefs(v).find(t=>t.id===tid),r=taskState(p,v,t);if(!canWriteTask(p,v,t))return;let valid=[...files].filter(f=>['image/jpeg','image/png','application/pdf'].includes(f.type)&&f.size<=5*1024*1024);if(!valid.length){toast('请选择 5MB 以内的 JPG、PNG 或 PDF');return}r.files??=[];valid.forEach(f=>{let key=id+'-'+v+'-'+tid;(uploads[key]??=[]).push({name:f.name,type:f.type,url:URL.createObjectURL(f)});r.files.push({name:f.name,size:f.size,type:f.type})});r.fileData={values:{count:r.files.length},submitted:false,source:'CRC'};taskTransition(p,v,t,'data');persist();refresh();if(state.drawer)drawDrawer();fileTaskModal(id,v,tid)}
function submitTaskFiles(id,v,tid){let p=pBy(id),t=taskDefs(v).find(t=>t.id===tid),r=taskState(p,v,t);if(!canWriteTask(p,v,t)||!r.files?.length)return;if(r.fileData.submitted)r.fileData.synced=true;else{r.fileData.submitted=true;r.fileData.synced=false}persist();refresh();if(state.drawer)drawDrawer();fileTaskModal(id,v,tid)}

db.participants.forEach(p=>p.visits.forEach((z,v)=>taskDefs(v).forEach(t=>taskState(p,v,t))));
refresh();
</script>
