<script src="participant-directory-data.js?v=enrollment-date-3"></script>
  <script>
const params = new URLSearchParams(location.search);
const demoIdentity = window.demoParticipantIdentity;
const requestedId = params.get('id') || 'S001';
const id = demoIdentity.canonicalId(requestedId);
if (!params.get('project')) {
 const study = window.clinicalParticipantDirectory.create().participants.find(person => person.id === id)?.study || 'CT-2026-001';
 params.set('project', study);
 const contextURL = new URL(location.href);contextURL.searchParams.set('project', study);history.replaceState(null,'',contextURL);
}
const name = demoIdentity.name(id, params.get('name')) || 'ZXX';
const status = params.get('status') || '已入组';
if (requestedId !== id) {
  const url = new URL(location.href);
  url.searchParams.set('id', id);
  url.searchParams.set('name', name);
  params.set('id', id);
  params.set('name', name);
  history.replaceState(null, '', url);
}
document.getElementById('person-name').textContent=name+'（'+id+'）';document.getElementById('person-status').textContent=status;
const visitData=[['筛选期'],['第1周期第1天（C1D1）'],['第1周期第15天（C1D15）']];
function setActiveMainTab(){document.querySelector('[data-participant-detail-tab="crf"]')?.click();}
    let selectedDataEntry=Number(params.get('visitIndex'))||0,selectedCrfName='生命体征';
    const entryGroups=[['筛选期',[['生命体征','done'],['血常规','warn'],['实验室检查','warn'],['心电图','']]],['第1周期第1天（C1D1）',[['生命体征','radio'],['不良事件','warn'],['用药记录','']]],['第1周期第15天（C1D15）',[['CT检查',''],['实验室检查',''],['体格检查','error']]]];
    const boundProtocol=window.visitProtocols.get(new URLSearchParams(location.search).get('project')||'CT-2026-001',window.visitProtocols.bind(new URLSearchParams(location.search).get('project')||'CT-2026-001',new URLSearchParams(location.search).get('id')||'S001'));
    boundProtocol?.visits.forEach((name,index)=>{if(entryGroups[index])entryGroups[index][0]=name;if(visitData[index])visitData[index][0]=name;});
    const overviewVisitNames=window.clinicalVisitStore.overviewNames(params.get('project'),id);
    if(overviewVisitNames)overviewVisitNames.forEach(cycle=>{
      if(entryGroups.some(group=>group[0]===cycle))return;
      const forms=window.clinicalVisitStore.executionItems({name:cycle,visitIndex:3});
      entryGroups.push([cycle,forms.map(name=>[name,''])]);
      visitData.push([cycle]);
    });
    const crfSaved=(cycle,name)=>{try{
      const record=JSON.parse(localStorage.getItem('journey-v2-clinical-entry-draft-'+params.get('project')+':'+params.get('id')+':'+cycle+':'+name)||(params.get('project')==='CT-2026-001'?localStorage.getItem('journey-v2-clinical-entry-draft-null:'+params.get('id')+':'+cycle+':'+name):null))||{};
      // Older manual collection marks must not imply that data entry was submitted.
      if(record.state==='已完成'&&(record.history||[]).some(item=>item.action==='手动标记完成')){
        const entryAction=[...(record.history||[])].reverse().find(item=>['完成同步','提交数据','保存草稿'].includes(item.action));
        return {...record,state:entryAction?{'完成同步':'已完成','提交数据':'待同步','保存草稿':'草稿'}[entryAction.action]:(record.values||[]).some(Boolean)?'草稿':''};
      }
      return record;
    }catch{return {};}};
    function renderDataEntry(){
      const list=document.getElementById('data-cycle-list');if(!list)return;
      list.innerHTML=entryGroups.map((g,gi)=>({g,gi})).sort((a,b)=>overviewVisitNames?overviewVisitNames.indexOf(a.g[0])-overviewVisitNames.indexOf(b.g[0]):a.gi-b.gi).map(({g,gi})=>'<div class="data-cycle-group"><button class="data-cycle-head" type="button" aria-expanded="true"><span class="data-caret"></span>'+g[0]+'<span class="count">'+g[1].filter(item=>crfSaved(gi,item[0]).state==='已完成').length+'/'+g[1].length+'</span></button>'+g[1].map(item=>{const record=crfSaved(gi,item[0]);const state=record.state||((record.values||[]).some(Boolean)?'待提交':'待录入');return '<button class="data-crf-card" type="button" aria-selected="'+(gi===selectedDataEntry&&item[0]===selectedCrfName)+'" data-data-visit="'+gi+'" data-crf="'+item[0]+'" data-state="'+state+'"><span>'+item[0]+'</span><i class="dot '+(state==='已完成'?'done':state==='待录入'?'':'warn')+'" title="'+state+'"></i></button>';}).join('')+'</div>').join('');
      document.getElementById('data-entry-title').textContent='CRF：'+selectedCrfName;
      window.dispatchEvent(new CustomEvent('journey-v2-clinical-crf-select',{detail:{cycle:selectedDataEntry,name:selectedCrfName}}));
    }
    window.addEventListener('crf-state-change',renderDataEntry);
    function openDataEntry(index=2,crf){selectedDataEntry=entryGroups[index]?index:2;selectedCrfName=crf||entryGroups[selectedDataEntry][1][0][0];renderDataEntry();setActiveMainTab('访视管理');document.querySelector('.data-crf-card[aria-selected="true"]')?.scrollIntoView({block:'nearest'});}
    window.openLinkedCrf=(cycle,name)=>{if(!['血常规','生命体征'].includes(name))return;if(!entryGroups[cycle])entryGroups[cycle]=[visitData[cycle]?.[0]||'筛选期',[]];if(!entryGroups[cycle][1].some(item=>item[0]===name))entryGroups[cycle][1].push([name,'']);openDataEntry(cycle,name);};
    document.getElementById('data-cycle-list')?.addEventListener('click',e=>{const button=e.target.closest('[data-data-visit]');if(!button)return;selectedDataEntry=Number(button.dataset.dataVisit);selectedCrfName=button.dataset.crf;renderDataEntry();});
    window.participantCrfCatalog = {visits:entryGroups, read:crfSaved, open:openDataEntry};
    renderDataEntry();
</script>
