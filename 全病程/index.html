<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台 · 临床研究</title>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="workbench.css?v=26">
<script src="dialog-focus.js"></script><script src="required-fields.js?v=1"></script>
<script src="demo-participant-identity.js?v=1"></script><script src="visit-protocols.js?v=demo-identity-1"></script>
<script src="shared-scope.js?v=project-resets-center-4"></script><script src="app-shell.js?v=clinical-research-brand-2"></script><link rel="stylesheet" href="aggregate-navigation.css?v=scope-transition-3">
<link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="colors.css?v=restore-medical-blue-4"><link rel="stylesheet" href="navigation.css?v=square-collapsed-6"><link rel="stylesheet" href="workbench-focus.css?v=project-first-1"><link rel="stylesheet" href="workbench-layout.css?v=focus-tabs-6"><link rel="stylesheet" href="workbench-figma.css?v=collection-method-1"><link rel="stylesheet" href="task-drawers.css?v=adjustment-preview-1"><link rel="stylesheet" href="centered-dialogs.css?v=required-markers-2"><style>[data-quiet-dialog]:focus,[data-quiet-dialog]:focus-visible{outline:none!important}</style><link rel="stylesheet" href="global-topbar.css?v=detail-scope-disabled-15"><link rel="stylesheet" href="form-preview.css?v=direct-task-content-2"><script src="form-preview.js?v=secondary-form-preview-3" defer></script><link rel="stylesheet" href="workbench-overview.css?v=figma-workbench-4972-1"><link rel="stylesheet" href="workbench-task-rules.css?v=details-form-layout-30"><link rel="stylesheet" href="table-actions.css?v=soft-shadow-2"><link rel="stylesheet" href="visit-status.css?v=inactive-state-4"><link rel="stylesheet" href="workbench-figma-layout.css?v=today-heading-final-20"><link rel="stylesheet" href="task-status-tags.css?v=1"><link rel="stylesheet" href="task-details.css?v=compact-result-no-note-3"><script src="task-details.js?v=compact-result-no-note-4" defer></script></head>
<body>
  <main class="page">
    <section class="workbench-one" aria-label="工作台">
      <header class="wb1-toolbar">
        <div class="wb1-toolbar-title"><strong>任务与访视概览</strong><span>查看当前研究项目的任务和近期访视</span></div>
        <div class="wb1-filter is-select"><select data-wb1-project aria-label="项目筛选"><option value="">全部项目</option><option>HER2 阳性晚期乳腺癌真实世界研究</option><option>非小细胞肺癌 II 期研究</option><option>乳腺癌 III 期临床研究</option><option>消化道肿瘤 III 期研究</option></select><button class="wb1-filter-clear" type="button" data-wb1-clear aria-label="清空项目筛选" hidden>×</button></div>
        <div class="wb1-filter is-select"><select data-wb1-center aria-label="研究中心筛选"><option value="">全部中心</option><option>第一医院</option><option>第二医院</option></select><button class="wb1-filter-clear" type="button" data-wb1-clear aria-label="清空研究中心筛选" hidden>×</button></div>
        <div class="wb1-filter is-search is-wide"><svg class="wb1-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input data-wb1-participant type="search" aria-label="搜索参与者姓名缩写或编号" placeholder="参与者姓名缩写/编号"><button class="wb1-filter-clear" type="button" data-wb1-clear aria-label="清空参与者搜索" hidden>×</button></div>
        <button class="wb1-filter-reset" type="button" data-wb1-reset>重置</button>
      </header>

      <div class="wb1-layout wb-overview-layout" data-wb-overview>
        <div class="wb1-task-workspace">
          <div class="wb1-task-summary" aria-label="待办任务统计">
            <button class="wb1-task-card" data-wb1-summary="appointment" type="button" aria-pressed="false"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">待访视预约</span><strong>0</strong></span></button>
            <button class="wb1-task-card" data-wb1-summary="followup" type="button" aria-pressed="false" title="待跟进参与者"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">待跟进参与者</span><strong>4</strong></span></button>
            <button class="wb1-task-card" data-wb1-summary="processing" type="button" aria-pressed="false" title="待数据录入"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">待数据录入</span><strong>4</strong></span></button>
            <button class="wb1-task-card is-active" data-wb1-summary="issue" type="button" aria-pressed="true" title="待发放访视任务"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">待发放访视任务</span><strong>7</strong></span></button>
            <button class="wb1-task-card" data-wb1-summary="execution" type="button" aria-pressed="false" title="待处理访视任务"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">待处理访视任务</span><strong>6</strong></span></button>
            <button class="wb1-task-card" data-wb1-summary="execution-overdue" type="button" aria-pressed="false" title="逾期待处理访视任务"><span class="wb1-stat-art" aria-hidden="true"><span class="wb1-stat-sprite"><img src="figma-workbench-assets/task-center-icons-v5.png" alt=""></span></span><span class="wb1-stat-copy"><span class="wb1-stat-label">逾期待处理访视任务</span><strong>1</strong></span></button>
          </div>

          <section class="wb1-panel wb1-task-panel" aria-label="任务处理" hidden>
          <div class="wb1-task-tools" role="tablist" aria-label="任务状态">
            <button class="wb1-task-tab" data-wb1-tab="draft" role="tab" aria-selected="true" type="button">待发放（7）</button>
            <button class="wb1-task-tab" data-wb1-tab="sent" role="tab" aria-selected="false" type="button">已发放（5）</button>
            <button class="wb1-task-tab" data-wb1-tab="none" role="tab" aria-selected="false" type="button">无需处理（5）</button>
            <button class="wb1-task-tab" data-wb1-tab="completed" role="tab" aria-selected="false" type="button" hidden>已完成（0）</button>
            <button class="wb1-task-tab" data-wb1-tab="execution-none" role="tab" aria-selected="false" type="button" hidden>无需处理（0）</button>
          </div>
          <div class="wb1-execution-switch" role="group" aria-label="待处理范围" hidden>
            <button type="button" data-execution-range="all" aria-pressed="true">全部</button>
            <button type="button" data-execution-range="today" aria-pressed="false">今日</button>
            <button type="button" data-execution-range="overdue" aria-pressed="false">逾期</button>
          </div>
          <div class="wb1-table-wrap">
            <table class="wb1-table">
              <colgroup data-wb1-table-cols><col style="width:16%"><col style="width:20%"><col style="width:15%"><col style="width:12%"><col style="width:22%"><col style="width:15%"></colgroup>
              <thead data-wb1-table-head><tr><th>参与者</th><th>任务名称</th><th>参与试验</th><th>访视</th><th>计划日期/访视窗口</th><th>操作</th></tr></thead>
              <tbody data-wb1-table-body></tbody>
            </table>
          </div>
          <nav class="wb1-pagination" data-wb1-pagination aria-label="任务列表分页"></nav>
          </section>
        </div>

        <section class="wb1-panel wb-overview-list wb-overview-today" aria-labelledby="wb-today-title">
          <header class="wb-today-heading">
            <div class="wb-today-heading-background" aria-hidden="true"><img src="figma-workbench-assets/today-heading-background.png" alt=""></div>
            <div class="wb-today-heading-identity"><span class="wb-today-heading-icon" aria-hidden="true"><img src="figma-workbench-assets/today-heading-icon.png" alt=""></span><div class="wb-today-heading-copy"><h2 id="wb-today-title">今日待办</h2><p>聚焦今日工作，请优先处理～</p></div></div>
            <div class="wb-today-heading-total" aria-label="今日待处理总数"><strong data-wb-today-total>0</strong><span>项待处理</span></div>
          </header>
          <div class="wb-today-content">
          <div class="wb-today-toolbar">
            <div class="wb-overview-tabs" role="tablist" aria-label="今日待办类型">
              <button type="button" id="wb-today-visits" role="tab" aria-controls="wb-today-panel" aria-selected="false" tabindex="-1" data-today-tab="visits">今日访视<span></span></button>
              <button type="button" id="wb-today-execution" role="tab" aria-controls="wb-today-panel" aria-selected="true" data-today-tab="execution">任务待处理<span></span></button>
              <button type="button" id="wb-today-followup" role="tab" aria-controls="wb-today-panel" aria-selected="false" tabindex="-1" data-today-tab="followup">待跟进<span></span></button>
              <button type="button" id="wb-today-appointment" role="tab" aria-controls="wb-today-panel" aria-selected="false" tabindex="-1" data-today-tab="appointment">访视未预约<span></span></button>
            </div>
          </div>
          <div id="wb-today-panel" data-wb-today role="tabpanel" aria-labelledby="wb-today-execution" tabindex="0">
            <div class="wb-today-table-wrap">
              <table class="wb-today-table">
                <colgroup></colgroup>
                <thead></thead>
                <tbody data-wb-today-rows></tbody>
              </table>
            </div>
            <nav class="wb1-pagination wb-today-pagination" data-wb-today-pagination aria-label="今日待办分页"></nav>
          </div>
          </div>
        </section>
        <section class="wb1-panel wb-overview-list wb-overview-attention" aria-labelledby="wb-attention-title">
          <div class="wb-attention-heading"><h2 id="wb-attention-title">重点关注</h2><a data-wb-all-visits href="participants.html?view=visits">全部访视 <span aria-hidden="true">›</span></a></div>
          <div data-wb-attention></div>
        </section>
      </div>
    </section>
  </main>
  <div class="wb1-issue-mask" data-wb1-issue-modal hidden>
    <section class="wb1-issue-modal" role="dialog" aria-modal="true" aria-labelledby="wb1-issue-title">
      <header class="wb1-issue-head">
        <div>
          <h2 id="wb1-issue-title" data-wb1-issue-title>发放任务</h2>
          <div class="wb1-issue-subject"><strong data-wb1-issue-participant></strong><span data-wb1-issue-id></span><em data-wb1-issue-status>已入组</em></div>
          <p class="wb1-adjustment-task" data-wb1-adjustment-task hidden></p>
        </div>
        <button type="button" data-wb1-issue-close aria-label="关闭">×</button>
      </header>
      <div class="wb1-issue-body">
        <section class="wb1-issue-card" data-wb1-issue-details>
          <h3><span>1</span>任务信息</h3>
          <dl class="wb1-issue-info">
            <div><dt>任务名称</dt><dd data-wb1-issue-task></dd></div>
            <div><dt>访视</dt><dd data-wb1-issue-visit></dd></div>
            <div><dt>采集方式</dt><dd data-wb1-issue-method></dd><small data-wb1-issue-form-name hidden></small></div>
            <div><dt>填写方式</dt><dd data-wb1-issue-fill-mode></dd></div>
            <div class="is-full"><dt>任务说明</dt><dd class="is-description" data-wb1-issue-description></dd></div>
          </dl>
        </section>

        <section class="wb1-issue-card" data-wb1-issue-details>
          <div class="wb1-issue-section-head"><h3><span>2</span>采集配置</h3><em>配置来源：任务模板</em></div>
          <dl class="wb1-issue-config">
            <div><dt>采集周期</dt><dd data-wb1-issue-cycle></dd></div>
            <div><dt>时间基准</dt><dd data-wb1-issue-baseline></dd></div>
            <div><dt>采集安排</dt><dd data-wb1-issue-template-times></dd></div>
            <div><dt>时间窗口</dt><dd data-wb1-issue-window></dd></div>
            <div><dt>逾期执行</dt><dd><span class="wb1-config-switch" data-wb1-issue-overdue></span></dd></div>
            <div><dt>自动映射CRF</dt><dd><span class="wb1-config-switch" data-wb1-issue-auto-map></span></dd></div>
          </dl>
        </section>

        <section class="wb1-issue-card">
          <div class="wb1-issue-section-head" data-wb1-issue-details><h3><span>3</span>基准日期及生成结果</h3><em data-wb1-issue-count></em></div>
          <div class="wb1-date-anchor">
            <div><label for="wb1-issue-date" data-wb1-issue-date-label>访视日期（基准日期）</label><span id="wb1-issue-date-help" data-wb1-issue-date-help>修改后，系统将立即重新计算下方尚未执行的任务。</span></div>
            <input id="wb1-issue-date" data-wb1-issue-date type="date" aria-describedby="wb1-issue-date-help" required>
          </div>
          <div class="wb1-issue-adjustment" data-wb1-issue-adjustment hidden>
            <label for="wb1-issue-adjustment-reason">调整原因</label>
            <textarea id="wb1-issue-adjustment-reason" rows="3" maxlength="200" placeholder="请输入调整原因" aria-describedby="wb1-issue-adjustment-error" required disabled></textarea>
            <small id="wb1-issue-adjustment-error" role="alert"></small>
          </div>
          <div class="wb1-issue-preview-wrap" data-wb1-issue-details>
            <table class="wb1-issue-preview">
              <thead><tr><th>执行任务</th><th>计划日期</th><th>采集时间</th><th>允许执行窗口</th><th>状态</th></tr></thead>
              <tbody data-wb1-issue-preview></tbody>
            </table>
          </div>
        </section>
        <section class="wb1-issue-card" data-wb1-adjustment-preview hidden aria-labelledby="wb1-adjustment-preview-title">
          <div class="wb1-issue-section-head">
            <h3 id="wb1-adjustment-preview-title">调整预览</h3>
            <em data-wb1-adjustment-count></em>
          </div>
          <div class="wb1-issue-preview-wrap">
            <table class="wb1-adjustment-preview">
              <thead><tr><th scope="col">执行任务</th><th scope="col">调整前</th><th scope="col">调整后</th></tr></thead>
              <tbody data-wb1-adjustment-rows></tbody>
            </table>
          </div>
        </section>
      </div>
      <footer class="wb1-issue-foot">
        <button type="button" data-wb1-issue-cancel>取消</button>
        <button class="is-secondary" type="button" data-wb1-issue-save>保存暂不发放</button>
        <button class="is-primary" type="button" data-wb1-issue-confirm>确认发放</button>
      </footer>
    </section>
  </div>
  <div class="wb1-execution-mask" data-wb1-execution-modal hidden>
    <section class="wb1-execution-modal" role="dialog" aria-modal="true" aria-labelledby="wb1-execution-title">
      <header class="wb1-execution-head">
        <div><h2 id="wb1-execution-title" data-wb1-execution-title>查看任务</h2><p data-wb1-execution-subject></p></div>
        <button type="button" data-wb1-execution-close aria-label="关闭">×</button>
      </header>
      <div class="wb1-execution-body" data-wb1-execution-body></div>
      <footer class="wb1-execution-foot">
        <button type="button" data-wb1-execution-package>查看任务包配置</button>
        <button type="button" data-wb1-execution-cancel>关闭</button>
        <button class="is-primary" type="button" data-wb1-execution-submit hidden>提交任务</button>
      </footer>
    </section>
  </div>
  <div class="wb1-reason-mask" data-wb1-reason-modal hidden>
    <section class="wb1-reason-modal" role="dialog" aria-modal="true" aria-labelledby="wb1-reason-title">
      <header class="wb1-reason-head">
        <div><h2 id="wb1-reason-title" data-wb1-reason-title>无需处理</h2><p data-wb1-reason-subject></p></div>
        <button type="button" data-wb1-reason-close aria-label="关闭">×</button>
      </header>
      <div class="wb1-reason-body">
        <label><span data-wb1-reason-label>无需处理原因 <em>*</em></span><textarea data-wb1-reason-input maxlength="200" placeholder="请填写无需处理原因，最多200字符"></textarea></label>
        <div class="wb1-reason-meta"><strong data-wb1-reason-error></strong><span><b data-wb1-reason-count>0</b>/200</span></div>
      </div>
      <footer class="wb1-reason-foot">
        <button type="button" data-wb1-reason-cancel>取消</button>
        <button class="is-primary" type="button" data-wb1-reason-submit>确认无需处理</button>
      </footer>
    </section>
  </div>
  <div class="wb1-reason-mask" data-wb1-followup-modal hidden>
    <section class="wb1-reason-modal" role="dialog" aria-modal="true" aria-labelledby="wb1-followup-title">
      <form data-wb1-followup-form>
        <header class="wb1-reason-head">
          <div><h2 id="wb1-followup-title">添加跟进</h2><p data-wb1-followup-subject></p></div>
          <button type="button" data-wb1-followup-close aria-label="关闭添加跟进">×</button>
        </header>
        <div class="wb1-reason-body wb1-followup-fields">
          <label><span>跟进日期 <em>*</em></span><input name="date" type="date" required aria-label="跟进日期"></label>
          <label><span>跟进内容 <em>*</em></span><textarea name="content" required maxlength="500" placeholder="请输入跟进内容，最多500字符" aria-label="跟进内容"></textarea></label>
          <div class="wb1-reason-meta"><strong data-wb1-followup-error role="alert"></strong><span><b data-wb1-followup-count>0</b>/500</span></div>
        </div>
        <footer class="wb1-reason-foot">
          <button type="button" data-wb1-followup-close>取消</button>
          <button class="is-primary" type="submit">保存</button>
        </footer>
      </form>
    </section>
  </div>
  <div class="wb1-toast" data-wb1-toast role="status" hidden></div>
  <div class="wb1-action-menu" data-wb1-action-menu hidden></div>
  <script src="research-data.js?v=concrete-visit-names-5"></script>
  <script src="clinical-visit-store.js?v=date-only-item-plan-13"></script><script src="participant-directory-data.js?v=enrollment-number-4"></script>
  <script src="workbench-task-policy.js?v=issued-execution-1"></script>
  <script src="participant-tasks.js?v=completed-result-button-18"></script>
  <script src="workbench-task-dialogs.js?v=default-later-execution-27"></script>
  <script src="workbench.js?v=processing-list-filters-43"></script>
<script src="workbench-context.js?v=calendar-task-count-1"></script><script src="global-participant-search.js?v=scope-reconciliation-3"></script>
<script src="workbench-list-filters.js?v=processing-trial-visit-9"></script><script src="workbench-overview.js?v=remove-window-module-4"></script><script src="aggregate-navigation.js?v=detail-scope-disabled-6"></script><script src="table-actions.js?v=1"></script></body>
</html>
