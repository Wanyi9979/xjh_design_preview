<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待制定访视计划</title><style>

    .list-header{height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px}.list-header h1{font-size:16px;line-height:24px;margin:0;font-weight:600}.search{width:314px;height:36px;border:1px solid #e5e5e5;border-radius:2px;background:white;color:#262626;padding:0 12px;font-size:12px}.search::placeholder{color:#b5b5b5}
    .table-shell{background:white;overflow-x:auto}.table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:left;font-size:12px}.table th{height:37px;color:#606060;font-weight:500;background:#fff;border-bottom:1px solid #f0f0f0;padding:0 16px}.table td{height:48px;padding:0 16px;border-bottom:1px solid #f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table tr:last-child td{border-bottom:0}.table .number{width:152px}.table .name-col{width:calc(100% - 152px - 345px - 174px)}.table .count{width:345px}.table .action{width:174px}.project-name{display:flex;align-items:center;gap:10px;min-width:0}.folder-box{width:28px;height:28px;border-radius:6px;background:#ebf5ff;display:flex;align-items:center;justify-content:center;flex:none}.folder-box img{width:18px;height:18px}.project-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.action-text{color:#168aef;white-space:nowrap}.empty{height:96px;text-align:center!important;color:#999}
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;height:48px;font-size:12px}.page-btn{width:32px;height:32px;background:#fff;border:1px solid #d9d9d9;border-radius:2px;color:#666;display:flex;align-items:center;justify-content:center;padding:0}.page-btn img{width:12px;height:12px}.page-btn.current{border-color:#1890ff;color:#1890ff}.page-btn:disabled{opacity:.5;cursor:default}.action-text{text-decoration:none}.action-text:hover{text-decoration:underline}
    @media(max-width:1190px){.stat{padding:12px}.stat-title{font-size:12px}.stat-icon{width:20px;height:20px}.stat-value{gap:5px}.table .count{width:180px}.table .name-col{width:calc(100% - 152px - 180px - 134px)}.table .action{width:134px}}

  </style><link rel="stylesheet" href="clinical-tasks.css"><link rel="stylesheet" href="clinical-research-shell.css">
